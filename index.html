<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PWA 記帳本</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* PWA 閃亮外框動畫 */
        @keyframes glowing-border {
            0% { box-shadow: 0 0 5px #ff7eb3, 0 0 10px #ff7eb3, 0 0 15px #ff7eb3; border-color: #ff7eb3; }
            50% { box-shadow: 0 0 20px #ff758c, 0 0 30px #ff758c, 0 0 40px #ff758c; border-color: #ff758c; }
            100% { box-shadow: 0 0 5px #ff7eb3, 0 0 10px #ff7eb3, 0 0 15px #ff7eb3; border-color: #ff7eb3; }
        }
        .pwa-shine-btn {
            animation: glowing-border 2s infinite;
            border: 2px solid #ff7eb3;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20 select-none">

    <!-- 頂部導航與 PWA 安裝區 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-wallet mr-2"></i>我的記帳本</h1>
        <div id="pwa-install-container" class="hidden">
            <button id="pwa-install-btn" class="pwa-shine-btn bg-white text-indigo-600 px-3 py-1.5 rounded-full text-xs font-bold shadow flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> 安裝 APP
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-md mx-auto p-4">

        <!-- 1. 首頁 / 記帳面板 -->
        <section id="view-home" class="space-y-4">
            <!-- 總金額與月分導航 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <input type="month" id="month-picker" class="bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-700 outline-none">
                        <button id="btn-this-month" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-100 transition">本月</button>
                    </div>
                </div>
                <div class="text-center py-2">
                    <span class="text-xs text-gray-400 block">本月結餘</span>
                    <h2 id="total-balance" class="text-2xl font-black text-indigo-600">$0</h2>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-100 text-center">
                    <div>
                        <span class="text-xs text-gray-400 block">本月收入</span>
                        <span id="total-income" class="text-base font-bold text-emerald-600">$0</span>
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 block">本月支出</span>
                        <span id="total-expense" class="text-base font-bold text-rose-600">$0</span>
                    </div>
                </div>
            </div>

            <!-- 支出 / 收入 選擇與按鈕群 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex bg-gray-100 p-1 rounded-xl mb-4">
                    <button id="tab-expense" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" onclick="switchType('expense')">支出</button>
                    <button id="tab-income" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 transition" onclick="switchType('income')">收入</button>
                </div>

                <!-- 分類按鈕容器 (可拖曳與刪除) -->
                <div id="category-grid" class="grid grid-cols-4 gap-3 text-center">
                    <!-- 動態載入 -->
                </div>
                <button onclick="openAddCategoryModal()" class="w-full mt-3 py-2 border-2 border-dashed border-gray-200 text-gray-400 rounded-xl text-xs font-semibold hover:border-indigo-400 hover:text-indigo-500 transition">
                    <i class="fa-solid fa-plus mr-1"></i> 新增自訂分類
                </button>
            </div>
        </section>

        <!-- 2. 明細頁面 -->
        <section id="view-details" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <div id="filter-chips" class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                    <button class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-bold shrink-0" onclick="filterCategory('all', this)">全部</button>
                </div>
                <div class="flex items-center gap-2 pl-2 border-l border-gray-200 shrink-0">
                    <select id="sort-order" onchange="renderDetails()" class="bg-gray-100 text-xs font-semibold px-2 py-1.5 rounded-lg outline-none">
                        <option value="desc">日期新->舊</option>
                        <option value="asc">日期舊->新</option>
                    </select>
                </div>
            </div>

            <!-- 合計顯示區 -->
            <div class="bg-indigo-50 px-4 py-2.5 rounded-xl flex justify-between items-center text-xs font-bold text-indigo-700">
                <span id="filter-name-display">當前篩選合計：</span>
                <span id="filtered-total-amount" class="text-sm">$0</span>
            </div>

            <!-- 明細列表 -->
            <div id="transaction-list" class="space-y-2.5">
                <!-- 動態載入明細 -->
            </div>
        </section>

        <!-- 3. 報表頁面 -->
        <section id="view-reports" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-3">分類支出佔比</h3>
                <div id="report-list" class="space-y-2 text-xs">
                    <!-- 統計列 -->
                </div>
            </div>
        </section>

        <!-- 4. 設定 / 帳號頁面 -->
        <section id="view-settings" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="text-sm font-bold text-gray-700">雲端帳號同步 (Firebase)</h3>
                <div id="auth-status" class="text-xs text-gray-500">未登入</div>
                <div id="auth-form" class="space-y-2">
                    <input type="email" id="auth-email" placeholder="電子郵件" class="w-full bg-gray-100 px-3 py-2 rounded-xl text-xs outline-none">
                    <input type="password" id="auth-password" placeholder="密碼" class="w-full bg-gray-100 px-3 py-2 rounded-xl text-xs outline-none">
                    <div class="flex gap-2">
                        <button onclick="handleLogin()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">登入</button>
                        <button onclick="handleRegister()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold">註冊</button>
                    </div>
                </div>
                <button id="btn-logout" onclick="handleLogout()" class="hidden w-full bg-rose-50 text-rose-600 py-2 rounded-xl text-xs font-bold">登出</button>
            </div>
        </section>

    </main>

    <!-- 底部導航欄 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-around items-center z-30 max-w-md mx-auto">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-indigo-600 text-xs font-bold">
            <i class="fa-solid fa-house text-base"></i> 記帳
        </button>
        <button onclick="switchTab('details')" id="nav-details" class="flex flex-col items-center text-gray-400 text-xs font-bold">
            <i class="fa-solid fa-list text-base"></i> 明細
        </button>
        <button onclick="switchTab('reports')" id="nav-reports" class="flex flex-col items-center text-gray-400 text-xs font-bold">
            <i class="fa-solid fa-chart-pie text-base"></i> 報表
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-gray-400 text-xs font-bold">
            <i class="fa-solid fa-user-gear text-base"></i> 設定
        </button>
    </nav>

    <!-- 記帳金額輸入彈窗 (儲存按鈕在金額上方) -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-2xl p-5 space-y-4 shadow-xl animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-category-title" class="font-bold text-sm text-gray-700">記帳</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">日期</label>
                    <input type="date" id="input-date" class="w-full bg-gray-100 p-2.5 rounded-xl text-sm font-semibold outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">金額</label>
                    <input type="number" id="input-amount" placeholder="0" class="w-full bg-gray-100 p-3 rounded-xl text-xl font-black text-indigo-600 outline-none text-center">
                </div>
                <!-- 儲存按鈕放在金額上方 -->
                <button onclick="saveTransaction()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 transition">儲存紀錄</button>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">備註 (選填)</label>
                    <input type="text" id="input-note" placeholder="例如: 午餐吃牛肉麵" class="w-full bg-gray-100 p-2.5 rounded-xl text-xs outline-none">
                </div>
            </div>
        </div>
    </div>

    <!-- 新增自訂分類彈窗 -->
    <div id="category-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 class="font-bold text-sm text-gray-700">新增自訂分類</h3>
            <input type="text" id="new-cat-name" placeholder="分類名稱" class="w-full bg-gray-100 p-2.5 rounded-xl text-xs outline-none">
            <div class="flex gap-2">
                <button onclick="closeAddCategoryModal()" class="flex-1 bg-gray-200 py-2 rounded-xl text-xs font-bold text-gray-600">取消</button>
                <button onclick="confirmAddCategory()" class="flex-1 bg-indigo-600 py-2 rounded-xl text-xs font-bold text-white">新增</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase 預設設定 (保留你原本的配置)
        const firebaseConfig = {
            apiKey: "AIzaSyD-placeholder",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT"
        };
        
        // 簡易初始化防錯
        let auth, db;
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) { console.log("Firebase config pending"); }

        // 全域狀態
        window.currentType = 'expense';
        window.selectedCategory = '';
        window.currentFilterCat = 'all';
        window.transactions = JSON.parse(localStorage.getItem('local_txs')) || [];
        window.categories = JSON.parse(localStorage.getItem('local_cats')) || {
            expense: ['餐飲', '交通', '購物', '娛樂', '醫療', '居住'],
            income: ['薪資', '投資', '獎金', '其他']
        };
        window.categoryOrder = JSON.parse(localStorage.getItem('local_cat_order')) || {
            expense: [...window.categories.expense],
            income: [...window.categories.income]
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('month-picker').value = today.slice(0, 7);
            document.getElementById('input-date').value = today;

            document.getElementById('month-picker').addEventListener('change', updateUI);
            document.getElementById('btn-this-month').addEventListener('click', () => {
                document.getElementById('month-picker').value = new Date().toISOString().slice(0, 7);
                updateUI();
            });

            renderCategories();
            updateUI();
        });

        // 頁面切換
        window.switchTab = function(tab) {
            ['home', 'details', 'reports', 'settings'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-indigo-600');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tab}`).classList.add('text-indigo-600');

            if(tab === 'details') renderDetails();
            if(tab === 'reports') renderReports();
        }

        window.switchType = function(type) {
            window.currentType = type;
            const isExp = type === 'expense';
            document.getElementById('tab-expense').className = `flex-1 py-2 text-sm font-bold rounded-lg transition ${isExp ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500'}`;
            document.getElementById('tab-income').className = `flex-1 py-2 text-sm font-bold rounded-lg transition ${!isExp ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500'}`;
            renderCategories();
        }

        // 渲染分類按鈕 (支援拖曳與長按刪除)
        window.renderCategories = function() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            const list = window.categoryOrder[window.currentType] || window.categories[window.currentType];

            list.forEach((cat, index) => {
                const btn = document.createElement('div');
                btn.className = "relative bg-gray-50 border border-gray-100 p-3 rounded-2xl flex flex-col items-center justify-center gap-1 cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition group";
                btn.draggable = true;

                btn.innerHTML = `
                    <span class="text-xs font-bold text-gray-700">${cat}</span>
                    <button onclick="deleteCategory(event, '${cat}')" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                `;

                // 點擊開啟記帳彈窗
                btn.addEventListener('click', (e) => {
                    if(e.target.closest('button')) return;
                    openModal(cat);
                });

                // 拖曳排序事件
                btn.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', index));
                btn.addEventListener('dragover', (e) => e.preventDefault());
                btn.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIndex = index;
                    const movedItem = list.splice(fromIndex, 1)[0];
                    list.splice(toIndex, 0, movedItem);
                    localStorage.setItem('local_cat_order', JSON.stringify(window.categoryOrder));
                    renderCategories();
                });

                grid.appendChild(btn);
            });
        }

        // 刪除分類 (連動刪除明細)
        window.deleteCategory = function(e, cat) {
            e.stopPropagation();
            if(!confirm(`確定要刪除分類「${cat}」嗎？這將會一併清除該分類下的所有歷史記帳！`)) return;

            window.categoryOrder[window.currentType] = window.categoryOrder[window.currentType].filter(c => c !== cat);
            window.categories[window.currentType] = window.categories[window.currentType].filter(c => c !== cat);
            localStorage.setItem('local_cats', JSON.stringify(window.categories));
            localStorage.setItem('local_cat_order', JSON.stringify(window.categoryOrder));

            // 連動清除該分類明細
            window.transactions = window.transactions.filter(t => t.category !== cat);
            localStorage.setItem('local_txs', JSON.stringify(window.transactions));

            renderCategories();
            updateUI();
        }

        window.openModal = function(cat) {
            window.selectedCategory = cat;
            document.getElementById('modal-category-titleinnerText').textContent = `記帳 - ${cat}`;
            document.getElementById('input-amount').value = '';
            document.getElementById('input-note').value = '';
            document.getElementById('add-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-amount').focus(), 100);
        }

        window.closeModal = function() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        window.openAddCategoryModal = function() {
            document.getElementById('category-modal').classList.remove('hidden');
        }
        window.closeAddCategoryModal = function() {
            document.getElementById('category-modal').classList.add('hidden');
            document.getElementById('new-cat-name').value = '';
        }
        window.confirmAddCategory = function() {
            const name = document.getElementById('new-cat-name').value.trim();
            if(!name) return;
            if(!window.categories[window.currentType].includes(name)) {
                window.categories[window.currentType].push(name);
                window.categoryOrder[window.currentType].push(name);
                localStorage.setItem('local_cats', JSON.stringify(window.categories));
                localStorage.setItem('local_cat_order', JSON.stringify(window.categoryOrder));
                renderCategories();
            }
            closeAddCategoryModal();
        }

        // 儲存記帳
        window.saveTransaction = function() {
            const amount = parseFloat(document.getElementById('input-amount').value);
            if(!amount || isNaN(amount)) { alert('請輸入有效金額'); return; }

            const tx = {
                id: Date.now().toString(),
                type: window.currentType,
                category: window.selectedCategory,
                amount: amount,
                date: document.getElementById('input-date').value,
                note: document.getElementById('input-note').value
            };

            window.transactions.push(tx);
            localStorage.setItem('local_txs', JSON.stringify(window.transactions));
            closeModal();
            updateUI();
        }

        // 更新介面總金額
        window.updateUI = function() {
            const selectedMonth = document.getElementById('month-picker').value;
            let totalInc = 0, totalExp = 0;

            window.transactions.forEach(t => {
                if(t.date.startsWith(selectedMonth)) {
                    if(t.type === 'income') totalInc += t.amount;
                    else totalExp += t.amount;
                }
            });

            document.getElementById('total-income').textContent = `$${totalInc.toLocaleString()}`;
            document.getElementById('total-expense').textContent = `$${totalExp.toLocaleString()}`;
            document.getElementById('total-balance').textContent = `$${(totalInc - totalExp).toLocaleString()}`;
        }

        // 渲染明細頁面
        window.renderDetails = function() {
            const selectedMonth = document.getElementById('month-picker').value;
            const listContainer = document.getElementById('transaction-list');
            const chipsContainer = document.getElementById('filter-chips');
            const sortOrder = document.getElementById('sort-order').value;

            // 收集所有出現過的分類
            const allCats = [...new Set(window.transactions.map(t => t.category))];
            chipsContainer.innerHTML = `<button class="px-3 py-1.5 ${window.currentFilterCat === 'all' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'} rounded-lg font-bold shrink-0 transition" onclick="filterCategory('all', this)">全部</button>`;
            allCats.forEach(c => {
                chipsContainer.innerHTML += `<button class="px-3 py-1.5 ${window.currentFilterCat === c ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'} rounded-lg font-bold shrink-0 transition" onclick="filterCategory('${c}', this)">${c}</button>`;
            });

            // 過濾與排序
            let filtered = window.transactions.filter(t => t.date.startsWith(selectedMonth));
            if(window.currentFilterCat !== 'all') {
                filtered = filtered.filter(t => t.category === window.currentFilterCat);
            }

            filtered.sort((a, b) => {
                return sortOrder === 'desc' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date);
            });

            // 計算合計
            const sum = filtered.reduce((acc, cur) => acc + cur.amount, 0);
            document.getElementById('filter-name-display').textContent = `[${window.currentFilterCat === 'all' ? '全部' : window.currentFilterCat}] 合計：`;
            document.getElementById('filtered-total-amount').textContent = `$${sum.toLocaleString()}`;

            listContainer.innerHTML = '';
            if(filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">沒有找到記帳明細</div>`;
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center relative overflow-hidden";
                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-gray-800">${t.category}</span>
                            <span class="text-[10px] text-gray-400">${t.date}</span>
                        </div>
                        ${t.note ? `<p class="text-xs text-gray-500">${t.note}</p>` : ''}
                    </div>
                    <span class="text-sm font-black ${t.type === 'income' ? 'text-emerald-600' : 'text-gray-800'}">${t.type === 'income' ? '+' : '-'}$${t.amount.toLocaleString()}</span>
                `;

                // 長按刪除機制 (支援手機觸控與滑鼠長按)
                let pressTimer;
                const startPress = () => {
                    pressTimer = setTimeout(() => {
                        if(confirm(`是否刪除這筆 ${t.category} $${t.amount} 的紀錄？`)) {
                            deleteTransaction(t.id);
                        }
                    }, 500); // 0.5秒
                };
                const cancelPress = () => clearTimeout(pressTimer);

                item.addEventListener('touchstart', startPress);
                item.addEventListener('touchend', cancelPress);
                item.addEventListener('mousedown', startPress);
                item.addEventListener('mouseup', cancelPress);
                item.addEventListener('mouseleave', cancelPress);

                listContainer.appendChild(item);
            });
        }

        window.filterCategory = function(cat, btn) {
            window.currentFilterCat = cat;
            renderDetails();
        }

        window.deleteTransaction = function(id) {
            window.transactions = window.transactions.filter(t => t.id !== id);
            localStorage.setItem('local_txs', JSON.stringify(window.transactions));
            renderDetails();
            updateUI();
        }

        // 報表頁面
        window.renderReports = function() {
            const selectedMonth = document.getElementById('month-picker').value;
            const container = document.getElementById('report-list');
            container.innerHTML = '';

            let catTotals = {};
            let totalExp = 0;

            window.transactions.forEach(t => {
                if(t.date.startsWith(selectedMonth) && t.type === 'expense') {
                    catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
                    totalExp += t.amount;
                }
            });

            if(totalExp === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">本月尚無支出資料</div>`;
                return;
            }

            Object.entries(catTotals).forEach(([cat, amt]) => {
                const percent = Math.round((amt / totalExp) * 100);
                container.innerHTML = container.innerHTML + `
                    <div class="space-y-1">
                        <div class="flex justify-between font-semibold text-gray-700">
                            <span>${cat}</span>
                            <span>$${amt.toLocaleString()} (${percent}%)</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-600 h-full rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
        }

        // PWA 安裝邏輯
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-install-container').classList.remove('hidden');
        });
        document.getElementById('pwa-install-btn').addEventListener('click', async () => {
            if(deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if(outcome === 'accepted') {
                    document.getElementById('pwa-install-container').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
